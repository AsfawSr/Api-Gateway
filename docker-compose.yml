version: '3.8'

# =============================================================================
# Docker Compose – Full Stack (Commit 21)
#
# CONCEPT: Container Orchestration
# ─────────────────────────────────
# Docker Compose lets us define and run all services together.
# Networking: all services share the "gateway-network" bridge network.
# Services can communicate by container name (DNS resolution).
#
# Start order via depends_on:
#   Redis & Postgres → Discovery Server → Services → API Gateway
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: asfaw
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asfaw"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Discovery Server ────────────────────────────────────────────────────

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Microservices ────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdGVzdGluZyBwdXJwb3NlcyBvbmx5
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce
      - SPRING_DATASOURCE_USERNAME=asfaw
      - SPRING_DATASOURCE_PASSWORD=secret123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gateway-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce
      - SPRING_DATASOURCE_USERNAME=asfaw
      - SPRING_DATASOURCE_PASSWORD=secret123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gateway-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ecommerce
      - SPRING_DATASOURCE_USERNAME=asfaw
      - SPRING_DATASOURCE_PASSWORD=secret123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gateway-network

  # ── API Gateway ──────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - JWT_SECRET=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3QgdGVzdGluZyBwdXJwb3NlcyBvbmx5
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - gateway-network

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  postgres-data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  gateway-network:
    driver: bridge
